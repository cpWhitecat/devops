name: Security Scan with SQLMap

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target:
        description: '扫描目标 URL'
        required: false
        default: 'http://192.168.159.16'

jobs:
  security-scan:
    name: Run SQLMap on CentOS Runner
    runs-on: [self-hosted, linux]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Scans Folder
        run: |
          mkdir -p ${{ github.workspace }}/scans
          # 必须赋予权限，否则 Docker 写入的 root 文件 Runner 读不了
          sudo chmod -R 777 ${{ github.workspace }}/scans

      - name: Run SQLMap Container
        env:
          TARGET: ${{ github.event.inputs.target || secrets.SCAN_TARGET }}
        run: |
          if [ -z "$TARGET" ]; then
            echo "Error: No target specified"
            exit 1
          fi
          # 运行扫描，|| true 确保即使扫描没东西也不中断 Workflow
          docker run --rm \
            -e TARGET="$TARGET" \
            -v "${{ github.workspace }}/scans:/scans" \
            security-scanner:latest || echo "Scan session ended"

      - name: Generate Sophisticated Report
        if: always()
        run: |
          # 再次赋予权限以读取 Docker 产生的子目录
          sudo chmod -R 777 ${{ github.workspace }}/scans
          # 直接把根目录传给脚本，脚本会自动递归寻找 run.log
          python3 generate_report.py "${{ github.workspace }}/scans"

      - name: Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlmap-security-report
          # 匹配 scans 目录下任何位置的 report.html
          path: ${{ github.workspace }}/scans/**/report.html
          retention-days: 5